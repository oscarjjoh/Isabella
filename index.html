<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Till Isabella ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff1f5, #fce4ec, #f8d7e2);
      color: #3b2630;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }
    .card {
      width: 100%;
      max-width: 680px;
      background: rgba(255,255,255,.96);
      border-radius: 24px;
      padding: 34px;
      box-shadow: 0 15px 45px rgba(100,40,65,.15);
    }
    h1 { text-align:center; margin:0 0 8px; color:#b83262; }
    .intro { text-align:center; line-height:1.6; margin-bottom:28px; }
    .heart { font-size:42px; text-align:center; margin-bottom:8px; }
    .question {
      padding: 18px 0;
      border-top: 1px solid #f0d8e0;
    }
    .question:first-of-type { border-top:0; }
    label.title {
      display:block;
      font-weight:700;
      margin-bottom:12px;
      font-size:17px;
    }
    .yesno {
      display:flex;
      gap:12px;
    }
    .yesno label {
      flex:1;
      cursor:pointer;
    }
    .yesno input { display:none; }
    .choice {
      display:block;
      text-align:center;
      padding:12px;
      border:2px solid #ead0da;
      border-radius:12px;
      transition:.2s;
      background:#fff;
    }
    .yesno input:checked + .choice {
      border-color:#c83f70;
      background:#ffe5ee;
      color:#a52857;
      font-weight:700;
    }
    textarea, input[type="text"] {
      width:100%;
      border:2px solid #ead0da;
      border-radius:12px;
      padding:13px;
      font:inherit;
      resize:vertical;
      outline:none;
    }
    textarea:focus, input[type="text"]:focus { border-color:#c83f70; }
    textarea { min-height:100px; }
    button {
      width:100%;
      border:0;
      border-radius:14px;
      padding:15px;
      margin-top:20px;
      background:#c83f70;
      color:white;
      font-size:17px;
      font-weight:700;
      cursor:pointer;
    }
    button:hover { background:#ad315e; }
    .small {
      text-align:center;
      font-size:16px;
      font-weight:800;
      color:#b83262;
      margin:18px 0 0;
      padding:12px;
      background:#fff0f5;
      border-radius:12px;
      border:1px solid #f2c5d4;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px 8px;
        align-items: flex-start;
      }

      .card {
        padding: 22px 16px;
        border-radius: 18px;
        margin: 0;
      }

      h1 {
        font-size: 25px;
        line-height: 1.2;
      }

      .heart {
        font-size: 36px;
      }

      .intro {
        font-size: 15px;
        margin-bottom: 18px;
      }

      .question {
        padding: 16px 0;
      }

      label.title {
        font-size: 16px;
        line-height: 1.4;
      }

      .yesno {
        gap: 8px;
      }

      .choice {
        padding: 12px 8px;
        font-size: 15px;
      }

      textarea,
      input[type="text"] {
        font-size: 16px;
        padding: 12px;
      }

      textarea {
        min-height: 110px;
      }

      button {
        padding: 15px 12px;
        font-size: 16px;
      }

      .small {
        font-size: 17px;
        padding: 14px 10px;
        margin-top: 16px;
      }
    }

    @media (max-width: 380px) {
      .card {
        padding: 18px 12px;
      }

      h1 {
        font-size: 23px;
      }

      .choice {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart">❤️</div>
    <h1>Isabella, jag har några frågor till dig</h1>
    <p class="intro">
      Det här är kanske ett lite annorlunda sätt att fråga saker...
      men jag vill verkligen veta vad du känner. Svara ärligt för helvete. ❤️
    </p>

    <form action="https://formsubmit.co/oscarjjoh@hotmail.com" method="POST">
      <input type="hidden" name="_subject" value="Isabellas svar på frågorna ❤️">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">

      <section class="question">
        <label class="title">1. Tycker du om mig?</label>
        <div class="yesno">
          <label><input type="radio" name="Tycker du om mig?" value="Ja" required><span class="choice">Ja ❤️</span></label>
          <label><input type="radio" name="Tycker du om mig?" value="Nej"><span class="choice">Nej</span></label>
        </div>
      </section>

      <section class="question">
        <label class="title">2. Har du känslor för mig?</label>
        <div class="yesno">
          <label><input type="radio" name="Har du känslor för mig?" value="Ja" required><span class="choice">Ja ❤️</span></label>
          <label><input type="radio" name="Har du känslor för mig?" value="Nej"><span class="choice">Nej</span></label>
        </div>
      </section>

      <section class="question">
        <label class="title">3. Är du kär i mig?</label>
        <div class="yesno">
          <label><input type="radio" name="Är du kär i mig?" value="Ja" required><span class="choice">Ja ❤️</span></label>
          <label><input type="radio" name="Är du kär i mig?" value="Nej"><span class="choice">Nej</span></label>
        </div>
      </section>

      <section class="question">
        <label class="title">4. Kan du se oss som något mer än bara vänner?</label>
        <div class="yesno">
          <label><input type="radio" name="Kan du se oss som något mer?" value="Ja" required><span class="choice">Ja ❤️</span></label>
          <label><input type="radio" name="Kan du se oss som något mer?" value="Nej"><span class="choice">Nej</span></label>
        </div>
      </section>

      <section class="question">
        <label class="title">5. Blir du glad när du ser ett meddelande från mig?</label>
        <div class="yesno">
          <label><input type="radio" name="Blir du glad av mina meddelanden?" value="Ja" required><span class="choice">Ja 😊</span></label>
          <label><input type="radio" name="Blir du glad av mina meddelanden?" value="Nej"><span class="choice">Nej</span></label>
        </div>
      </section>

      <section class="question">
        <label class="title">6. Skulle du vilja träffa mig? ❤️</label>
        <div class="yesno">
          <label><input type="radio" name="Skulle du vilja träffa mig?" value="Ja" required><span class="choice">Ja ❤️</span></label>
          <label><input type="radio" name="Skulle du vilja träffa mig?" value="Nej"><span class="choice">Nej</span></label>
        </div>
      </section>

      <section class="question">
        <label class="title">7. Vad känner du för mig?</label>
        <textarea name="Vad känner du för mig?" required placeholder="Skriv precis det du känner..."></textarea>
      </section>

      <section class="question">
        <label class="title">8. Vad är det du tycker mest om med mig?</label>
        <textarea name="Vad tycker du mest om med mig?" required placeholder="Det första du kommer att tänka på..."></textarea>
      </section>

      <section class="question">
        <label class="title">9. Vad är det första du tänker på när du tänker på mig?</label>
        <textarea name="Vad tänker du på när du tänker på mig?" required></textarea>
      </section>

      <section class="question">
        <label class="title">10. Om du fick beskriva oss med tre ord, vilka skulle du välja?</label>
        <textarea name="Beskriv oss med tre ord" required></textarea>
      </section>

      <section class="question">
        <label class="title">11. Finns det något du önskar att jag visste om dina känslor för mig?</label>
        <textarea name="Något du önskar att jag visste" required></textarea>
      </section>

      <section class="question">
        <label class="title">12. Och den viktigaste frågan... vill du ge oss en chans? ❤️</label>
        <div class="yesno">
          <label><input type="radio" name="Vill du ge oss en chans?" value="Ja" required><span class="choice">Ja ❤️</span></label>
          <label><input type="radio" name="Vill du ge oss en chans?" value="Nej"><span class="choice">Nej</span></label>
        </div>
      </section>

      <button type="submit">Skicka mina svar till Oscar ❤️</button>
      <p class="small">Det finns bara ett rätt svar ❤️</p>
    </form>
  </main>
</body>
</html>
